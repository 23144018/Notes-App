<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notes App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
      font-size: 14px;
    }

    button {
      background: #4CAF50;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #45a049;
    }

    .notes {
      margin-top: 20px;
    }

    .note {
      background: #e9f5e9;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      position: relative;
      word-wrap: break-word;
    }

    .note button {
      background: #ff4d4d;
      padding: 5px 8px;
      font-size: 12px;
      position: absolute;
      top: 8px;
      right: 8px;
    }

    .note button:hover {
      background: #e60000;
    }
  </style>
</head>
<body>
  <h1>📝 Notes App</h1>
  <div class="container">
    <textarea id="noteInput" placeholder="Write your note here..."></textarea>
    <button id="addNoteBtn">Add Note</button>

    <div class="notes" id="notesContainer"></div>
  </div>

  <script>
    const noteInput = document.getElementById('noteInput');
    const addNoteBtn = document.getElementById('addNoteBtn');
    const notesContainer = document.getElementById('notesContainer');

    // Load notes from localStorage on page load
    document.addEventListener('DOMContentLoaded', loadNotes);

    addNoteBtn.addEventListener('click', () => {
      const noteText = noteInput.value.trim();
      if (noteText !== "") {
        addNote(noteText);
        saveNoteToLocalStorage(noteText);
        noteInput.value = "";
      }
    });

    function addNote(text) {
      const note = document.createElement('div');
      note.classList.add('note');
      note.innerHTML = `
        <p>${text}</p>
        <button class="deleteBtn">X</button>
      `;
      notesContainer.appendChild(note);

      // Delete note event
      note.querySelector('.deleteBtn').addEventListener('click', () => {
        note.remove();
        deleteNoteFromLocalStorage(text);
      });
    }

    function saveNoteToLocalStorage(text) {
      let notes = JSON.parse(localStorage.getItem('notes')) || [];
      notes.push(text);
      localStorage.setItem('notes', JSON.stringify(notes));
    }

    function loadNotes() {
      let notes = JSON.parse(localStorage.getItem('notes')) || [];
      notes.forEach(noteText => {
        addNote(noteText);
      });
    }

    function deleteNoteFromLocalStorage(text) {
      let notes = JSON.parse(localStorage.getItem('notes')) || [];
      notes = notes.filter(note => note !== text);
      localStorage.setItem('notes', JSON.stringify(notes));
    }
  </script>
</body>
</html>
